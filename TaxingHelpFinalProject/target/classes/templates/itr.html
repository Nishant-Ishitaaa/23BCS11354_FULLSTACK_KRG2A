<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ITR Filing</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Income Tax Return Filing</h2>

                    <form action="/calculateTax" method="post">
                        <div class="mb-3">
                            <label for="income" class="form-label">Enter Annual Income</label>
                            <input type="number" class="form-control" id="income" name="income" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Calculate Tax</button>
                    </form>

                    <div th:if="${result}" class="mt-4 alert alert-success text-center" role="alert">
                        <span th:text="${result}"></span>
                    </div>

                    <div class="text-center mt-3">
                        <a href="/" class="btn btn-secondary">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS (optional, for interactive components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
